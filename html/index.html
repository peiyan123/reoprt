<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投资企业月报</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- 移动端样式单独保留，确保其在合并样式之后加载，以便正确覆盖 -->
    <link rel="stylesheet" href="css/mobile.css">
    <!-- Ant Design Icons CSS -->
    <link rel="stylesheet" href="https://at.alicdn.com/t/font_1329669_u69w8yhxdu.css">
    <!-- 箭头图标 -->
    <link rel="stylesheet" href="https://at.alicdn.com/t/font_1788044_0dwu4guekcwr.css">
</head>
<body>
    <div id="app">
        <div class="home-page">
            <!-- 顶部区域 -->
            <div class="top-header">
                <!-- Tabs -->
                <div class="top-tabs">
                    <div class="ant-tabs ant-tabs-top css-1p3hq3p">
                        <div role="tablist" class="ant-tabs-nav">
                            <div class="ant-tabs-nav-wrap">
                                <div class="ant-tabs-nav-list">
                                    <!-- Tab导航 -->
                                </div>
                            </div>
                        </div>
                        <div class="ant-tabs-content-holder">
                            <div class="ant-tabs-content ant-tabs-content-top">
                                <!-- Tab内容 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 移动端标题-->
            <div class="mobile-report-header" style="display: none;">
                <div class="mobile-header-top">
                    <h1 class="mobile-report-title"></h1>
                </div>
                <div class="mobile-report-info">
                    <span class="company-name"></span>
                    <span class="generate-date"></span>
                </div>
            </div>

            <!-- 移动端按钮样式 -->
            <div class="mobile-buttons" style="display: none;">
                <!-- 移动端Tab按钮 -->
            </div>

            <!-- 主体内容区域 -->
            <div class="main-content">
                <!-- 左侧导航 -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <span>快捷导航</span>
                    </div>
                    <div class="navigation-menu">
                        <div class="custom-menu" id="navigation-container">
                            <!-- 导航菜单 -->
                        </div>
                    </div>
                </div>

                <!-- 右侧正文 -->
                <div class="content-area">
                    <div class="content-wrapper">
                        <!-- 移动端Tab标题区-->
                        <div class="mobile-tab-header" style="display: none;">
                            <h2 class="mobile-tab-title"></h2>
                        </div>
                        
                        <!-- 桌面端标题区 -->
                        <div class="report-header">
                            <div class="report-header-top">
                                <div class="report-title-container">
                                    <h1 class="report-title"><span id="current-tab-name"></span></h1>
                                    <div class="report-info">
                                        <span class="company-name"></span>
                                        <span class="generate-date"></span>
                                    </div>
                                </div>
                               
                            </div>
                        </div>
                        
                        <!-- Tab 内容区域 -->
                        <div id="report-content-container" class="report-content-container">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载图表组件脚本 -->
    <script src="js/echarts.min.js"></script>
    <script src="js/chartRing.js"></script>
    <script src="js/chartBar.js"></script>
    <!-- 加载组件脚本 -->
    <script src="js/navigation.js"></script>
    <script src="js/table.js"></script>
    <script src="js/tips.js"></script>
    <script src="js/cardList.js"></script>
    <script src="js/tab.js"></script>
    <script src="js/dataLoader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
